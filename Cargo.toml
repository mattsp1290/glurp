[package]
name = "glurp"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Private remote chat archive collection over OpenSSH"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

