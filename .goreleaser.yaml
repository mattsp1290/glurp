version: 2

builds:
  - id: slurp
    main: ./cmd/slurp
    binary: slurp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/mattsp1290/slurp/internal/buildinfo.Version={{.Version}}
      - -X github.com/mattsp1290/slurp/internal/buildinfo.Commit={{.Commit}}

archives:
  - formats: [tar.gz]

checksum:
  name_template: checksums.txt
