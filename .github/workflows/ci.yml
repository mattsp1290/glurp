name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true
      - name: Format
        run: make fmt-check
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/glurp

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true
      - name: Exercise embedded collectors under macOS /bin/sh
        run: go test -race ./internal/harness ./internal/archive ./internal/integration
