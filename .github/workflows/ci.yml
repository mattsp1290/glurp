name: CI

on:
  push:
    # Tag builds are gated by the reusable CI job in release.yml.
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned compiler and checks
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustc --version | grep -F "rustc $channel "
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test library, integration, and example targets (actual POSIX collectors)
        run: cargo test --all-targets --locked
      - name: Test documentation examples
        run: cargo test --doc --locked
      - name: Test the locked standalone consumer
        run: cargo test --manifest-path tests/consumer/Cargo.toml --locked
      - name: Verify the exact checked-out Git dependency
        run: |
          python3 -S distribution/tests/check_git_consumer.py \
            --repository "$GITHUB_WORKSPACE" --revision "$(git rev-parse HEAD)"
      - name: Release build
        run: cargo build --release --locked
      - name: Test the release manifest and installer
        run: python3 -S distribution/tests/run_tests.py
